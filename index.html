<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de IMC</title>
    <link rel="shortcut icon" href="./diamond (1).png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="calculadora">
        <h1>Calculadora de IMC</h1>

        <div class="campo">
            <label for="peso" class="titulo">Peso em KG: </label>
            <br>
            <input type="number" id="peso" placeholder="Digite aqui" class="caixa">
        </div>

        <div class="campo">
            <label for="altura" class="titulo">Altura em metros: </label>
            <br>
            <input type="number" id="altura" placeholder="Digite aqui" class="caixa">
        </div>

        <button id="botao">Calcular IMC</button>

        <div id="resultado"></div>
    </section>
    <script src="./main.js"></script>
</body>
</html>
